name: CI/CD

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  checks: write
  issues: write
  pull-requests: read
  security-events: write

jobs:
  conventional-commits-warning:
    name: conventional-commits-warning
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && (github.event.action != 'labeled' || github.event.label.name == 'rerun-ci')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Report conventional commit warning
        uses: actions/github-script@v7
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        with:
          script: |
            const { execFileSync } = require("node:child_process");
            const pattern = /^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert|deps)(\([A-Za-z0-9_.-]+\))?(!)?: .+/;
            const invalid = [];
            if (!pattern.test(process.env.PR_TITLE)) invalid.push(`PR title: ${process.env.PR_TITLE}`);
            const range = `${process.env.BASE_SHA}..${process.env.HEAD_SHA}`;
            const subjects = execFileSync("git", ["log", "--no-merges", "--format=%s", range], { encoding: "utf8" }).split(/\r?\n/).filter(Boolean);
            for (const subject of subjects) if (!pattern.test(subject)) invalid.push(`Commit: ${subject}`);
            const marker = "<!-- conventional-commits-warning -->";
            const valid = invalid.length === 0;
            const summary = valid ? "PR title and commit messages follow Conventional Commits." : `The PR remains mergeable, but these messages do not follow Conventional Commits:\n\n${invalid.map(item => `- ${item}`).join("\n")}`;
            try { await github.rest.checks.create({ owner: context.repo.owner, repo: context.repo.repo, name: "conventional-commits", head_sha: process.env.HEAD_SHA, status: "completed", conclusion: valid ? "success" : "neutral", output: { title: valid ? "Conventional Commits" : "Conventional Commits warning", summary } }); } catch (error) { core.warning(`Could not publish the Conventional Commits check: ${error.message}`); }
            try {
              const comments = await github.paginate(github.rest.issues.listComments, { owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, per_page: 100 });
              const existing = comments.find(comment => comment.user?.type === "Bot" && comment.body?.includes(marker));
              if (invalid.length) { const body = `${marker}\n⚠️ **Conventional Commits:** aviso não bloqueante.\n\n${summary}\n\nO CI funcional continua sendo validado normalmente.`; if (existing) await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body }); else await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body }); }
              else if (existing) await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body: `${marker}\n✅ **Conventional Commits:** aviso resolvido; o título e os commits estão no padrão.` });
            } catch (error) { core.warning(`Could not publish the Conventional Commits comment: ${error.message}`); }

  ci:
    name: ci
    runs-on: ubuntu-latest
    if: github.event.action != 'labeled' || github.event.label.name == 'rerun-ci'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: "8.12"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build and test with Gradle
        run: ./gradlew clean build jacocoTestReport --no-daemon

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            build/libs/
            build/classes/
            build/reports/
          retention-days: 1

  deploy-discloud:
    name: deploy-discloud
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Ensure Discloud token is configured
        env:
          DISCLOUD_TOKEN: ${{ secrets.DISCLOUD_TOKEN }}
        run: test -n "$DISCLOUD_TOKEN"

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: build/

      - name: Prepare Discloud package
        env:
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_PROJECT_ID }}
          INFISICAL_ENVIRONMENT: ${{ secrets.INFISICAL_ENVIRONMENT }}
          INFISICAL_SECRET_PATH: ${{ secrets.INFISICAL_SECRET_PATH }}
          INFISICAL_SITE_URL: ${{ secrets.INFISICAL_SITE_URL }}
        run: |
          test -n "$INFISICAL_CLIENT_ID"
          test -n "$INFISICAL_CLIENT_SECRET"
          test -n "$INFISICAL_PROJECT_ID"
          test -n "$INFISICAL_ENVIRONMENT"
          test -n "$INFISICAL_SECRET_PATH"
          test -n "$INFISICAL_SITE_URL"
          cp build/libs/app.jar app.jar
          {
            printf 'INFISICAL_CLIENT_ID=%s\n' "$INFISICAL_CLIENT_ID"
            printf 'INFISICAL_CLIENT_SECRET=%s\n' "$INFISICAL_CLIENT_SECRET"
            printf 'INFISICAL_PROJECT_ID=%s\n' "$INFISICAL_PROJECT_ID"
            printf 'INFISICAL_ENVIRONMENT=%s\n' "$INFISICAL_ENVIRONMENT"
            printf 'INFISICAL_SECRET_PATH=%s\n' "$INFISICAL_SECRET_PATH"
            printf 'INFISICAL_SITE_URL=%s\n' "$INFISICAL_SITE_URL"
          } > .env

      - name: Deploy ms-spring-api to Discloud
        uses: discloud/deploy-action@fae7024653d941a19daa2b6f56d2ae208e008c54
        with:
          token: ${{ secrets.DISCLOUD_TOKEN }}
          app_id: ms-spring-api

      - name: Verify production endpoints
        run: |
          health="https://ms-spring-api.discloud.app/health"
          docs="https://ms-spring-api.discloud.app/v3/api-docs"

          ready=false
          for attempt in $(seq 1 60); do
            if health_json="$(curl -fsS --max-time 5 "${health}" 2>/dev/null)" \
              && jq -e '.status == "ok"' <<< "${health_json}" >/dev/null \
              && docs_json="$(curl -fsS --max-time 5 "${docs}" 2>/dev/null)" \
              && jq -e '.paths["/farms"] != null and .paths["/farm-owners/login"] == null' <<< "${docs_json}" >/dev/null; then
              ready=true
              break
            fi
            echo "Waiting for production ms-spring-api after deploy (attempt ${attempt}/60)..."
            sleep 5
          done

          if [[ "${ready}" != true ]]; then
            echo "Production ms-spring-api did not expose updated endpoints after deploy." >&2
            exit 1
          fi

  sonarcloud:
    name: sonarcloud
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: build/

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

  codeql:
    name: codeql
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: "8.12"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build for CodeQL
        run: ./gradlew compileJava compileTestJava --no-daemon

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@v3
