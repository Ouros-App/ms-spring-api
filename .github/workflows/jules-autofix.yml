name: Jules Auto-Fix Trigger (Checkbox & Commands)

on:
  issue_comment:
    types: [edited, created]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  autofix:
    name: jules-autofix
    # Dispara se for um comentário em uma PR E se tiver checkbox marcado com [x] ou menção @jules fix
    if: |
      github.event.issue.pull_request &&
      (
        contains(github.event.comment.body, '- [x]') ||
        contains(github.event.comment.body, '- [X]') ||
        contains(github.event.comment.body, '@jules fix') ||
        contains(github.event.comment.body, '@jules corrige')
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Trigger Jules Auto-Fix Session
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          PR_NUMBER: ${{ github.event.issue.number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: node .github/scripts/jules-autofix.js
