name: Jules Auto-Fix Trigger (Checkbox & Commands)

on:
  issue_comment:
    types: [edited, created]
  pull_request_review:
    types: [edited, submitted]
  pull_request_review_comment:
    types: [edited, created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Número da PR para aplicar o Auto-Fix'
        required: true
        default: '33'

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  autofix:
    name: jules-autofix
    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        contains(github.event.comment.body || github.event.review.body || '', '- [x]') ||
        contains(github.event.comment.body || github.event.review.body || '', '- [X]') ||
        contains(github.event.comment.body || github.event.review.body || '', '@jules fix') ||
        contains(github.event.comment.body || github.event.review.body || '', '@jules corrige')
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Trigger Jules Auto-Fix Session
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number || github.event.inputs.pr_number }}
          COMMENT_BODY: ${{ github.event.comment.body || github.event.review.body || '@jules fix all' }}
        run: node .github/scripts/jules-autofix.js
