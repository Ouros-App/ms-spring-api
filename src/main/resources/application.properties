spring.application.name=spring-api
server.port=${SERVER_PORT:8080}

# Importa as configuracoes locais se o arquivo existir (desenvolvimento)
spring.config.import=optional:classpath:application-local.properties

# JPA / Hibernate Configuration (Desativada a criacao automatica de tabelas)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.generate-ddl=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Configuracoes de Seguranca e JWT (Valores reais passados por variavel de ambiente ou application-local.properties)
app.jwt.secret=${JWT_SECRET:${APP_JWT_SECRET:}}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:${APP_JWT_EXPIRATION_MS:86400000}}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
