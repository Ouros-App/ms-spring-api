spring.application.name=spring-api
server.port=${SERVER_PORT:8080}

# Importa as configuracoes locais se o arquivo existir (desenvolvimento)
spring.config.import=optional:classpath:application-local.properties

# JPA / Hibernate Configuration (Desativada a criacao automatica de tabelas)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.generate-ddl=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Configuracoes de Seguranca e OAuth2 Resource Server (Keycloak OIDC)
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:https://ouros-keycloak.discloud.app/realms/ouros}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWKS_URI:https://ouros-keycloak.discloud.app/realms/ouros/protocol/openid-connect/certs}
app.security.oauth2.audience=${KEYCLOAK_AUDIENCE:ms-spring-api}

# Configuracoes de CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
