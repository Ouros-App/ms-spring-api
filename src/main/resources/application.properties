spring.application.name=spring-api
server.port=${SERVER_PORT:8080}

# Importa as configuracoes locais se o arquivo existir (desenvolvimento)
spring.config.import=optional:classpath:application-local.properties

# JPA / Hibernate Configuration (Desativada a criacao automatica de tabelas)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.generate-ddl=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Configuracoes de Seguranca (OAuth2 Resource Server / Keycloak)
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URL:https://ouros-keycloak.discloud.app/realms/ouros}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URL:https://ouros-keycloak.discloud.app/realms/ouros/protocol/openid-connect/certs}
app.security.oauth2.audience=${KEYCLOAK_AUDIENCE:ms-spring-api}
app.security.oauth2.client-id=${KEYCLOAK_CLIENT_ID:ms-spring-api}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}


# Prometheus / observability
management.endpoints.web.exposure.include=prometheus
management.endpoints.web.base-path=/
management.endpoints.web.path-mapping.prometheus=metrics
management.metrics.tags.service=ms-spring-api
management.metrics.distribution.percentiles-histogram.http.server.requests=true
app.security.metrics.authorized-party=${METRICS_KEYCLOAK_AUTHORIZED_PARTY:ouros-prometheus}

# Chave de autenticacao para chamadas M2M internas
app.internal.service-key=${INTERNAL_SERVICE_KEY:${INTERNAL_SERVICE_SECRET:}}

# ==========================================
# ⚡ Redis NoSQL Configuration (Upstash / Infisical)
# ==========================================
spring.data.redis.url=${REDIS_URL:${spring.data.redis.url:}}
spring.data.redis.timeout=5000ms
