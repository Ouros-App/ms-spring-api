# Configuracoes de Banco em Memoria para Testes Unitarios e Integracao (CI / GitHub Actions)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Configuracoes de Seguranca e JWT para Testes (Chave ficticia apenas para execucao dos testes)
app.jwt.secret=chave-ficticia-apenas-para-testes-unitarios-minimo-256-bits-123456
app.jwt.expiration-ms=86400000
